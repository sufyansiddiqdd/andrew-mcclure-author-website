kind = "web"
previewPath = "/"
title = "Love & Hate — Andrew McClure"
version = "1.0.0"
id = "artifacts/author-website"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25515

[services.development]
run = "pnpm --filter @workspace/author-website run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/author-website", "run", "build" ]
publicDir = "artifacts/author-website/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25515"
BASE_PATH = "/"
